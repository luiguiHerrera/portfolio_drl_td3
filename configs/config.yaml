project:
  name: portfolio_drl_td3
  description: TD3-based portfolio allocation model for TFM research

data:
  assets:
    - SPY
    - TLT
    - GLD
    - BTC-USD
    - CASH
  frequency: weekly
  start_date: null
  end_date: null

environment:
  initial_cash: 100000
  transaction_cost: 0.001
  allow_short: false
  max_weight_per_asset: 1.0

reward:
  lambda_return: 1.0
  lambda_sharpe: 0.5
  lambda_drawdown: 1.0
  lambda_transaction_cost: 0.2
  lambda_turnover: 0.1
  lambda_concentration: 0.0

td3:
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  gamma: 0.99
  tau: 0.005
  policy_noise: 0.2
  noise_clip: 0.5
  policy_delay: 2
  batch_size: 256
  replay_buffer_size: 100000

training:
  seed: 42
  episodes: 500
  train_ratio: 0.7
  validation_ratio: 0.15
  test_ratio: 0.15
