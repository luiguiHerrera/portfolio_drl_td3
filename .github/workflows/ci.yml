name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -v

      - name: Validate aligned paper comparison
        run: |
          PYTHONPATH=. python scripts/validate_paper_aligned_comparison.py \
            --output-dir outputs/paper_aligned_comparison

      - name: Validate seed-aggregated paper comparison
        run: |
          PYTHONPATH=. python scripts/validate_paper_seed_aggregated_comparison.py \
            --output-dir outputs/paper_seed_aggregated_comparison

